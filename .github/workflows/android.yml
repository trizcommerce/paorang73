# 안드로이드 설치 파일(APK)을 만든다. android/ 폴더가 바뀌거나, Actions 탭에서 직접 실행하면 돈다.
# 만든 파일은 downloads/paorang73-calendar.apk 로 저장소에 올리고, 사이트를 다시 배포해서
# https://trizcommerce.github.io/paorang73/downloads/ 에서 내려받을 수 있게 한다.
name: 안드로이드 앱 만들기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write
  actions: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: 서명 키 (처음 한 번만 만들고 저장소에 보관 — 같은 키여야 앱 위에 덮어 설치됨)
        run: |
          if [ ! -f android/release.keystore ]; then
            keytool -genkeypair -v -keystore android/release.keystore -alias berbertest \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass berbertest -keypass berbertest -dname "CN=paorang73, O=TRIZ, C=KR"
          fi
      - name: 버전 번호 (빌드할 때마다 1씩 올라감)
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"
      - name: APK 만들기
        working-directory: android
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon 2>&1 | tee build.log; then
            msg=$(grep -E "error:|What went wrong|\.java:[0-9]+" -A3 build.log | head -40 | tr '\n' '|')
            echo "::error title=build::$msg"
            exit 1
          fi
      - name: 저장소에 올리기
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/release/app-release.apk downloads/paorang73-calendar.apk
          echo "{\"versionCode\": $VERSION_CODE}" > downloads/android-version.json
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add downloads/paorang73-calendar.apk downloads/android-version.json android/release.keystore
          git commit -m "안드로이드 앱 파일 업데이트" || echo "변경 없음"
          git pull --rebase origin main
          git push
      - name: 사이트 다시 배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main
